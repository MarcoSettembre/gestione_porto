<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mappa Navi</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <style>
        #map { height: 100vh;  width: 100%; }
        .home-bar{

    position:absolute;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    display:flex;
    align-items:center;

    gap:12px;

    padding:10px 16px;

    border-radius:14px;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.home-btn{

    border:none;

    padding:8px 14px;

    border-radius:8px;

    background:#0077b6;

    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.home-btn:hover{

    background:#0096c7;

    transform:translateY(-2px);
}
.last-updated{

    position:absolute;
    top:15px;
    right:15px;

    z-index:1000;

    display:flex;
    align-items:center;

    padding:10px 14px;

    border-radius:14px;

    background:rgba(0,0,0,.55);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.15);

    color:white;

    font-size:14px;
    font-weight:500;

    box-shadow:0 8px 20px rgba(0,0,0,.3);

    gap:6px;
}

.last-updated::before{
    content:"🕒";
    font-size:14px;
}
    </style>
</head>
<body>
    <div class="home-bar">

    <span>
        Ritorna alla dashboard
    </span>

    <a href="/login">

        <button class="home-btn">

            Dashboard

        </button>

    </a>

</div>
<div class="last-updated">
    Last Updated:
    {% if last_update %}
        {{ last_update|date:"d/m/Y H:i" }} UTC
    {% else %}
        never
    {% endif %}
</div>
<div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    {{ navi_json|json_script:"navi-data" }}
<script>

const navi =
JSON.parse(document.getElementById("navi-data").textContent);

const map = L.map('map').setView([20,0],2);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);


const markers=[];
navi.forEach(nave=>{

    if(nave.latitudine !=null && nave.longitudine != null){

        const course = nave.direzione ?? 0;

let marker = L.marker(
    [nave.latitudine,nave.longitudine],
    {
        icon: L.divIcon({
            className: "",

            html: `
            <div style="
                transform: rotate(${course}deg);
            ">
                <svg width="30" height="30"
                     viewBox="0 0 100 100">

                    <polygon
                        points="50,5 90,90 50,70 10,90"
                        fill="#22c55e"
                        stroke="black"
                        stroke-width="4"
                    />

                </svg>
            </div>
            `,

            iconSize:[30,30],
            iconAnchor:[15,15]
        })
    }
).addTo(map);
        marker.bindPopup(`
            <b>${nave.nome}</b><br>
            IMO: ${nave.imo}<br>
            Compagnia: ${nave.compagnia}<br>
            Nazionalità: ${nave.nazionalita}<br>
            Tipo: ${nave.tipo}<br>
            Coordinate:
            ${nave.latitudine},
            ${nave.longitudine}<br>
            Direzione: ${nave.direzione}°
        `);

        markers.push(
            [nave.latitudine,nave.longitudine]
        );
    }

});


if(markers.length>0){
    map.fitBounds(markers);
}

</script>

</body>
</html>
