<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiunta Magazzino</title>
</head>
<body>
    <h1>Aggiunta Magazzino</h1>
    <br><br>
    <form method="POST" action="/magazzino/aggiungi">
        {% csrf_token %}
        <label for="nome">Nome: </label>
        <input type="text" name="nome" id="nome" required>
        <br><br>
        <label for="localita">Località: </label>
        <input type="text" name="localita" id="localita" required>
        <br><br>
        <label for="tipo">Tipo: </label>
        <input type="text" name="tipo" id="tipo" required>
        <br><br>
        <label for="capacita">Capacità: </label>
        <input type="number" name="capacita" id="capacita" required>
        <br><br>
        <button type="submit">Aggiungi</button>
    </form>
    <br><br>
    {% if error %}
    Errore: {{ error }}
    {% endif %}
</body>
</html>
