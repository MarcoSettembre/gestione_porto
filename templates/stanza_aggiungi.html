<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiunta Stanza</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Porto_de_Lisboa_%282%29.jpg/1280px-Porto_de_Lisboa_%282%29.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;

}


.container{

    width:100%;
    max-width:700px;

    margin:auto;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:18px;

    padding:40px;

    box-shadow:0 10px 25px rgba(0,0,0,.4);

}

h1{

    text-align:center;

    margin-bottom:30px;

}

.error{

    margin-bottom:20px;

    padding:12px;

    border-radius:10px;

    background:rgba(255,0,0,.15);

    border:1px solid rgba(255,0,0,.3);

}


.form-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:rgba(255,255,255,.12);

    color:white;

}

select option{
    color:black;
}


.button-row{

    display:flex;

    justify-content:space-between;

    margin-top:30px;

}

.left-buttons{

    display:flex;

    gap:10px;

}

button{

    border:none;

    padding:12px 22px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;

}


.add-btn{

    background:#0077b6;
    color:white;

}

.add-btn:hover{

    background:#0096c7;

    transform:translateY(-2px);

}


.reset-btn{

    background:#6c757d;
    color:white;

}

.reset-btn:hover{

    background:#868e96;

    transform:translateY(-2px);

}


.cancel-btn{

    background:#495057;
    color:white;

}

.cancel-btn:hover{

    background:#6c757d;

    transform:translateY(-2px);

}

a{
    text-decoration:none;
}


.footer-wrapper{

    margin-top:auto;

    padding:20px 30px;

}

.port-label{

    text-align:right;

    font-size:13px;

    opacity:.75;

}

</style>
</head>

<body>

<div class="container">

    <h1>
        Aggiunta stanza a nave con IMO {{imo}}
    </h1>

    {% if error %}
        <div class="error">
            Errore: {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/crociera/stanza/aggiungi/{{imo}}">
        {% csrf_token %}

        <div class="form-group">
            <label for="numero">
                Numero:
            </label>

            <input type="number"
                   min="1"
                   name="numero"
                   id="numero"
                   required>
        </div>


        <div class="form-group">

            <label for="classe">
                Classe:
            </label>

            <select name="classe"
                    id="classe"
                    required>

                <option disabled selected value>
                    ---
                </option>

                <option value="Interna">
                    Interna
                </option>

                <option value="Esterna">
                    Esterna
                </option>

                <option value="Suite">
                    Suite
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="tipo">
                Tipo:
            </label>

            <select name="tipo"
                    id="tipo"
                    required>

                <option disabled selected value>
                    ---
                </option>

                <option value="Singola">
                    Singola
                </option>

                <option value="Doppia">
                    Doppia
                </option>

                <option value="Matrimoniale">
                    Matrimoniale
                </option>

            </select>

        </div>


        <div class="button-row">

            <div class="left-buttons">

                <button type="submit"
                        class="add-btn">
                    Aggiungi
                </button>

                <button type="reset"
                        class="reset-btn">
                    Reset
                </button>

            </div>

            <a href="/crociera/stanza/{{imo}}">
                <button type="button"
                        class="cancel-btn">
                    Annulla
                </button>
            </a>

        </div>

    </form>

</div>


<div class="footer-wrapper">

    <div class="port-label">
        Porto di Lisbona
    </div>

</div>

</body>
</html>
