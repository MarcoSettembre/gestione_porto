<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Modifica Guida</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    background:
    linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Taino_bay_puerto_plata.jpg/1280px-Taino_bay_puerto_plata.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
}

.container{

    width:100%;
    max-width:850px;

    margin:auto;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);

    border-radius:18px;

    padding:40px;

    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

h1{

    text-align:center;

    margin-bottom:30px;
}

.error{

    margin-bottom:20px;

    padding:15px;

    border-radius:10px;

    background:rgba(255,0,0,.2);

    border:1px solid rgba(255,80,80,.3);

    text-align:center;
}

.form-group{

    margin-bottom:18px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;
}

input,
select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:rgba(255,255,255,.9);

    outline:none;
}

.button-row{

    display:flex;

    justify-content:space-between;

    margin-top:35px;
}

.left-buttons{

    display:flex;

    gap:12px;
}

button{

    border:none;

    padding:12px 24px;

    border-radius:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.submit-btn{

    background:#2a9d8f;

    color:white;
}

.submit-btn:hover{

    background:#34b3a5;

    transform:translateY(-2px);
}

.reset-btn{

    background:#f4a261;

    color:white;
}

.reset-btn:hover{

    background:#ffb87a;

    transform:translateY(-2px);
}

.cancel-btn{

    background:#495057;

    color:white;
}

.cancel-btn:hover{

    background:#6c757d;

    transform:translateY(-2px);
}

a{

    text-decoration:none;
}

.footer-wrapper{

    width:100%;

    margin-top:auto;

    padding:20px 30px;
}

.port-label{

    text-align:right;

    font-size:13px;

    opacity:.75;
}

</style>
</head>

<body>

<div class="container">

<h1>Modifica guida {{guida.codice_fiscale}}</h1>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST" action="/crociera/guida/modifica/{{guida.codice_fiscale}}">

{% csrf_token %}

<div class="form-group">
<label>Nome:</label>
<input type="text" name="nome" value="{{guida.nome}}" required>
</div>

<div class="form-group">
<label>Cognome:</label>
<input type="text" name="cognome" value="{{guida.cognome}}" required>
</div>

<div class="form-group">
<label>Data nascita:</label>
<input type="date" name="data_nascita"
       value="{{guida.data_nascita|date:'Y-m-d'}}"
       required>
</div>

<div class="form-group">
<label>Numero licenza:</label>
<input type="number" name="numero_licensa"
       value="{{guida.numero_licensa}}" required>
</div>

<div class="form-group">
<label>Stipendio:</label>
<input type="number" step="0.01" min="0.0"
       name="stipendio"
       value="{{guida.stipendio}}" required>
</div>

<div class="form-group">
<label>Data assunzione:</label>
<input type="date" name="data_assunzione"
       value="{{guida.data_assunzione|date:'Y-m-d'}}"
       required>
</div>

<div class="form-group">
<label>Valutazione:</label>
<input type="number" step="0.1" min="1.0" max="5.0"
       name="valutazione"
       value="{{guida.valutazione}}" required>
</div>

<div class="form-group">
<label>ID Itinerario:</label>

<select name="id_itinerario">

<option value="">---</option>

{% for ui in itinerari %}

<option value="{{ ui.itinerario.id }}"
{% if guida.id_itinerario_id == ui.itinerario.id %}selected{% endif %}>
{{ ui.itinerario.nome }}
</option>

{% endfor %}

</select>

</div>

<div class="form-group">
<label>Lingue (lingua:livello, separate da virgola):</label>

<input type="text"
       name="lingue"
       value="{{lingue}}"
       size="60">

</div>

<div class="button-row">

<div class="left-buttons">

<button type="submit" class="submit-btn">
Modifica
</button>

<button type="reset" class="reset-btn">
Reset
</button>

</div>

<a href="/crociera/guida">
<button type="button" class="cancel-btn">
Annulla
</button>
</a>

</div>

</form>

</div>

<div class="footer-wrapper">
<div class="port-label">
Porto di Puerto Plata
</div>
</div>

</body>
</html>
