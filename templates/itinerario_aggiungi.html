<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiunta Itinerario</title>
</head>
<body>

    <h1>Aggiunta itinerario</h1>

    <br><br>

    {% if error %}
        <p>{{ error }}</p>
        <br><br>
    {% endif %}

    <form method="POST" action="/crociera/itinerario/aggiungi">

        {% csrf_token %}

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" required>

        <br><br>

        <label for="data_inizio">Data inizio:</label>
        <input type="date" name="data_inizio" id="data_inizio" required>

        <br><br>

        <label for="data_fine">Data fine:</label>
        <input type="date" name="data_fine" id="data_fine" required>

        <br><br>

        <label for="prezzo">Prezzo:</label>
        <input type="number" step="0.01" name="prezzo" id="prezzo" required>

        <br><br>

        <label for="tappe">
            Tappe (separate da virgola):
        </label>

        <br><br>

        <input type="text" name="tappe" id="tappe" size="100">

        <br><br>

        <button type="submit">Aggiungi</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
