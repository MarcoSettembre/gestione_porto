<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Aggiunta Nave Crociera</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url("https://upload.wikimedia.org/wikipedia/commons/thumb/a/a3/PXL_20220828_112723994_%281%29.jpg/960px-PXL_20220828_112723994_%281%29.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
}


/* CARD */

.container{

    width:100%;
    max-width:700px;

    margin:auto;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.12);

    border-radius:18px;

    padding:40px;

    box-shadow:0 10px 25px rgba(0,0,0,.4);

}


h1{

    text-align:center;

    margin-bottom:30px;

}


label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}


input,
select{

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    margin-bottom:18px;

}


input:focus,
select:focus{

    outline:2px solid #90e0ef;

}


/* BOTTONI */

.button-row{

    display:flex;

    justify-content:space-between;

    gap:12px;

    margin-top:15px;

}


button{

    border:none;

    padding:12px 24px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;

}


.submit-btn{

    background:#0077b6;
    color:white;

}

.submit-btn:hover{

    background:#0096c7;
    transform:translateY(-2px);

}


.reset-btn{

    background:#495057;
    color:white;

}

.reset-btn:hover{

    background:#6c757d;
    transform:translateY(-2px);

}


/* ANNULLA */

.cancel{

    margin-top:25px;

    text-align:center;

}


.cancel button{

    background:#c1121f;
    color:white;

}

.cancel button:hover{

    background:#e5383b;

}


/* ERROR */

.error{

    margin-top:25px;

    color:#ffadad;

    text-align:center;

}


/* FOOTER */

.footer-wrapper{

    width:100%;

    margin-top:auto;

    padding:20px 30px;

}


.port-label{

    text-align:right;

    font-size:13px;

    opacity:.75;

}

</style>
</head>

<body>


<div class="container">

<h1>Aggiunta Nave Crociera</h1>

<form method="POST" action="/crociera/aggiungi">

{% csrf_token %}

<label for="imo">IMO:</label>
<input type="text" name="imo" id="imo" required>


<label for="nome">Nome:</label>
<input type="text" name="nome" id="nome" required>


<label for="nazionalita">Nazionalità:</label>
<input type="text" name="nazionalita" id="nazionalita" required>


<label for="compagnia">Compagnia:</label>
<input type="text" name="compagnia" id="compagnia" required>


<label for="altezza">Altezza:</label>
<input type="number"
step="any"
min="0.0"
name="altezza"
id="altezza"
required>


<label for="lunghezza">Lunghezza:</label>
<input type="number"
step="any"
min="0.0"
name="lunghezza"
id="lunghezza"
required>


<label for="larghezza">Larghezza:</label>
<input type="number"
step="any"
min="0.0"
name="larghezza"
id="larghezza"
required>


<label for="capienza">Capienza:</label>
<input type="number"
min="0"
name="capienza"
id="capienza"
required>


<label for="id_itinerario">
Itinerario:
</label>

<select name="id_itinerario" id="id_itinerario">

<option value="">
Nessuno
</option>

{% for i in itinerari %}

<option value="{{ i.id }}">
{{ i.nome }}
</option>

{% endfor %}

</select>


<div class="button-row">

<button type="submit"
class="submit-btn">

Aggiungi

</button>

<button type="reset"
class="reset-btn">

Reset

</button>

</div>

</form>


<div class="cancel">

<a href="/crociera">

<button>
Annulla
</button>

</a>

</div>


{% if error %}
<div class="error">

Errore: {{ error }}

</div>
{% endif %}


</div>


<div class="footer-wrapper">

<div class="port-label">
Porto di Southampton
</div>

</div>

</body>
</html>
