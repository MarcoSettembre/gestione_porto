<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Magazzino Merce</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
                linear-gradient(rgba(0,0,0,0.70), rgba(0,0,0,0.70)),
                url('https://www.adspmaredisardegna.it/wp-content/uploads/2018/01/slide-ca-01.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .card{

            width:520px;

            padding:35px;

            background:rgba(255,255,255,0.10);

            border-radius:20px;

            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,0.18);

            box-shadow:0 8px 32px rgba(0,0,0,0.35);
        }

        h1{

            text-align:center;

            margin-bottom:30px;

            font-size:28px;

            line-height:1.4;
        }

        .error{

            margin-bottom:22px;

            padding:12px;

            border-radius:10px;

            background:rgba(255,80,80,0.18);

            border:1px solid rgba(255,80,80,0.35);

            color:#ffd6d6;

            text-align:center;
        }

        form{

            display:flex;
            flex-direction:column;
        }

        label{

            margin-bottom:10px;

            font-weight:bold;
        }

        select{

            padding:11px 12px;

            border:none;
            border-radius:10px;

            background:rgba(255,255,255,0.92);

            font-size:14px;

            margin-bottom:25px;
        }

        .button-group{

            display:flex;

            gap:12px;
        }

        button{

            padding:11px 18px;

            border:none;
            border-radius:10px;

            font-weight:bold;

            cursor:pointer;

            transition:0.2s;
        }

        .primary{

            background:#0077b6;

            color:white;
        }

        .primary:hover{

            background:#0096c7;

            transform:translateY(-2px);
        }

        .secondary{

            background:#023e8a;

            color:white;
        }

        .secondary:hover{

            background:#0353a4;

            transform:translateY(-2px);
        }

        .cancel{

            margin-top:18px;

            text-align:center;
        }

        .cancel button{

            background:rgba(255,255,255,0.15);

            color:white;
        }

        .cancel button:hover{

            background:rgba(255,255,255,0.25);

            transform:translateY(-2px);
        }

        .port-label{

            position:absolute;

            bottom:15px;
            right:20px;

            font-size:13px;

            opacity:0.75;

            background:rgba(0,0,0,0.3);

            padding:6px 10px;

            border-radius:8px;

            backdrop-filter:blur(6px);
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Modifica magazzino merce con SSCC {{stoccaggio.sscc_id}}
    </h1>

    {% if error %}

        <div class="error">
            Errore: {{ error }}
        </div>

    {% endif %}

    <form method="POST"
          action="/magazzino/stoccaggio/modifica/{{sscc}}">

        {% csrf_token %}

        <label for="magazzino">
            Seleziona il magazzino:
        </label>

        <select name="magazzino" id="magazzino">

            {% for m in magazzini %}

                <option value="{{m.nome}}|{{m.localita}}"

                    {% if m.nome == stoccaggio.nome_magazzino and m.localita == stoccaggio.localita_magazzino %}
                        selected
                    {% endif %}

                >

                    {{m.nome}}/{{m.localita}}

                </option>

            {% endfor %}

        </select>

        <div class="button-group">

            <button type="submit" class="primary">
                Modifica
            </button>

            <button type="reset" class="secondary">
                Reset
            </button>

        </div>

    </form>

    <div class="cancel">

        <a href="/magazzino/stoccaggio/{{stoccaggio.nome_magazzino}}/{{stoccaggio.localita_magazzino}}">

            <button type="button">
                Annulla
            </button>

        </a>

    </div>

</div>

<div class="port-label">
    Porto di Cagliari
</div>

</body>
</html>
