<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Magazzino Merce</title>
</head>
<body>
    <h1>Modifica magazzino merce con SSCC {{sscc}}</h1>
    <br><br>
    {% if error %}
        <p>Errore: {{ error }}</p>
        <br><br>
    {% endif %}
    <form method="POST" action="/magazzino/stoccaggio/modifica/{{sscc}}">
        {% csrf_token %}
        <label for="magazzino">Seleziona il magazzino: </label>
        <select name="magazzino" id="magazzino">
            {% for m in magazzini %}
                <option value="{{m.nome}}|{{m.localita}}"
                {% if m.nome == stoccaggio.nome_magazzino and m.localita == stoccaggio.localita_magazzino %}
                    selected
                {% endif %}
                >{{m.nome}}/{{m.localita}}</option>
            {% endfor %}
        </select>
        <br><br>
        <button type="submit">Modifica</button> <button type="reset">Reset</button>
    </form>
</body>
</html>
