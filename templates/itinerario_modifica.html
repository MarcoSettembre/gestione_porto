<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Itinerario</title>
</head>
<body>

    <h1>Modifica itinerario {{itinerario.nome}}</h1>

    <br><br>

    {% if error %}
        <p>{{error}}</p>
        <br><br>
    {% endif %}

    <form method="POST" action="/crociera/itinerario/modifica/{{itinerario.id}}">

        {% csrf_token %}

        <label for="nome">Nome: </label>
        <input type="text"
               name="nome"
               id="nome"
               value="{{itinerario.nome}}"
               required>

        <br><br>

        <label for="data_inizio">Data inizio: </label>
        <input type="date"
               name="data_inizio"
               id="data_inizio"
               value="{{itinerario.data_inizio|date:'Y-m-d'}}"
               required>

        <br><br>

        <label for="data_fine">Data fine: </label>
        <input type="date"
               name="data_fine"
               id="data_fine"
               value="{{itinerario.data_fine|date:'Y-m-d'}}"
               required>

        <br><br>

        <label for="prezzo">Prezzo: </label>
        <input type="number"
               step="0.01"
               name="prezzo"
               id="prezzo"
               value="{{itinerario.prezzo}}"
               required>

        <br><br>

        <label for="tappe">
            Tappe (separate da virgole):
        </label>

        <br><br>

        <input type="text"
               name="tappe"
               id="tappe"
               value="{{tappe}}"
               size="100"
               required>

        <br><br>

        <button type="submit">Modifica</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
