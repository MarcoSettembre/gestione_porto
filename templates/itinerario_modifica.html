<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Itinerario</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            min-height:100vh;

            display:flex;
            flex-direction:column;

            background:
            linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
            url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/%2B_Am_Abend_ist_der_Blick_auf_Santa_Cruz_besonders_beeindruckend-_02.jpg/1920px-%2B_Am_Abend_ist_der_Blick_auf_Santa_Cruz_besonders_beeindruckend-_02.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .container{

            width:100%;
            max-width:800px;

            margin:auto;

            padding:40px;

            border-radius:20px;

            background:rgba(0,0,0,.55);

            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,.12);

            box-shadow:0 10px 30px rgba(0,0,0,.4);
        }

        h1{

            text-align:center;

            margin-bottom:30px;
        }

        .it-name{
            color:#90e0ef;
        }

        .error{

            background:rgba(255,0,0,.15);

            border-radius:10px;

            padding:12px;

            margin-bottom:25px;

            border:1px solid rgba(255,0,0,.25);
        }

        .field{

            display:flex;

            flex-direction:column;

            margin-bottom:18px;
        }

        label{

            font-weight:bold;

            margin-bottom:8px;
        }

        input{

            padding:12px;

            border:none;

            border-radius:10px;

            background:rgba(255,255,255,.15);

            color:white;
        }

        input:focus{

            outline:none;

            box-shadow:0 0 0 2px #90e0ef;
        }

        .buttons{

            display:flex;

            justify-content:space-between;

            margin-top:30px;
        }

        button{

            border:none;

            padding:12px 22px;

            border-radius:10px;

            font-weight:bold;

            cursor:pointer;

            transition:.2s;
        }

        .save-btn{

            background:#0077b6;

            color:white;
        }

        .save-btn:hover{

            background:#0096c7;

            transform:translateY(-2px);
        }

        .reset-btn{

            background:#495057;

            color:white;
        }

        .reset-btn:hover{

            background:#6c757d;

            transform:translateY(-2px);
        }

        .cancel{

            margin-top:30px;

            text-align:center;
        }

        .cancel button{

            background:#6c757d;

            color:white;
        }

        .cancel button:hover{

            background:#868e96;
        }

        a{
            text-decoration:none;
        }

        .footer-wrapper{

            width:100%;

            margin-top:auto;

            padding:20px 30px;
        }

        .port-label{

            text-align:right;

            font-size:13px;

            opacity:.75;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>

        Modifica itinerario
        <span class="it-name">
            {{itinerario.nome}}
        </span>

    </h1>


    {% if error %}
        <div class="error">
            {{error}}
        </div>
    {% endif %}


    <form method="POST"
          action="/crociera/itinerario/modifica/{{itinerario.id}}">

        {% csrf_token %}


        <div class="field">

            <label for="nome">
                Nome:
            </label>

            <input type="text"
                   name="nome"
                   id="nome"
                   value="{{itinerario.nome}}"
                   required>

        </div>


        <div class="field">

            <label for="data_inizio">
                Data inizio:
            </label>

            <input type="date"
                   name="data_inizio"
                   id="data_inizio"
                   value="{{itinerario.data_inizio|date:'Y-m-d'}}"
                   required>

        </div>


        <div class="field">

            <label for="data_fine">
                Data fine:
            </label>

            <input type="date"
                   name="data_fine"
                   id="data_fine"
                   value="{{itinerario.data_fine|date:'Y-m-d'}}"
                   required>

        </div>


        <div class="field">

            <label for="prezzo">
                Prezzo:
            </label>

            <input type="number"
                   step="0.01"
                   min="0.0"
                   name="prezzo"
                   id="prezzo"
                   value="{{itinerario.prezzo}}"
                   required>

        </div>


        <div class="field">

            <label for="tappe">
                Tappe (separate da virgole):
            </label>

            <input type="text"
                   name="tappe"
                   id="tappe"
                   value="{{tappe}}"
                   required>

        </div>


        <div class="buttons">

            <button type="submit"
                    class="save-btn">

                Modifica

            </button>


            <button type="reset"
                    class="reset-btn">

                Reset

            </button>

        </div>

    </form>


    <div class="cancel">

        <a href="/crociera/itinerario">

            <button>
                Annulla
            </button>

        </a>

    </div>

</div>


<div class="footer-wrapper">

    <div class="port-label">

        Porto di Santa Cruz de Tenerife

    </div>

</div>

</body>
</html>
