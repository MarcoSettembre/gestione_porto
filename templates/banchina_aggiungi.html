<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiunta Banchina</title>
</head>
<body>
    <h1>Aggiunta Banchina</h1>
    <br><br>
    <form method="POST" action="/banchina/aggiungi">
        {% csrf_token %}
        <br><br>
        <label for="numero">Numero: </label>
        <input type="number" id="numero" name="numero" required>
        <br><br>
        <label for="settore">Settore: </label>
        <input type="text" id="settore" name="settore" required>
        <br><br>
        <label for="tipo">Tipo: </label>
        <select id="tipo" name="tipo" required>
            <option disabled selected value>---</option>
            <option value="Cargo">Cargo</option>
            <option value="Crociera">Crociera</option>
        </select>
        <br><br>
        <label for="lunghezza">Lunghezza: </label>
        <input type="number" id="lunghezza" name="lunghezza" required>
        <br><br>
        <button type="submit">Aggiungi</button> <button type="reset">Reset</button>
    </form>
    <a href="/banchina"><button>Annulla</button></a>
</body>
</html>
