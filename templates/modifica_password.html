<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Password</title>
</head>
<body>
    <h1>Modifica Password</h1>
    <br><br>
    {% if error %}
        <p> {{ error }}</p>
        <br><br>
    {% endif %}
    <form method="POST" action="/modifica_password">
        {% csrf_token %}
        <label for="password_vecchia">Password attuale: </label>
        <input type="password" id="password_vecchia" name="password_vecchia" required><br><br>
        <label for="password_nuova">Nuova password: </label>
        <input type="password" id="password_nuova" name="password_nuova" required><br><br>
        <label for="password_nuova_conferma">Conferma nuova password: </label>
        <input type="password" id="password_nuova_conferma" name="password_nuova_conferma" required><br><br>
        <button type="submit">Modifica Password</button>
    </form>
    <a href="/login"><button>Annulla</button></a>
</body>
</html>
