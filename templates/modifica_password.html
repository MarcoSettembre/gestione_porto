<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Password</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(rgba(0,0,0,0.68), rgba(0,0,0,0.68)),
                url('https://upload.wikimedia.org/wikipedia/commons/6/64/Burchardkai-Nacht-%28Hamburg%29-msu-2021-4873-.jpg');

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: white;
        }

        .password-container{
            width: 460px;
            padding: 40px;

            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);

            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.18);

            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }

        h1{
            text-align: center;
            margin-bottom: 35px;

            font-size: 34px;
            letter-spacing: 1px;
        }

        form label{
            display: block;
            margin-bottom: 8px;

            font-weight: bold;
        }

        form input{
            width: 100%;
            padding: 12px;

            margin-bottom: 22px;

            border: none;
            border-radius: 10px;

            background: rgba(255,255,255,0.92);
            color: #222;

            font-size: 15px;
        }

        form input:focus{
            outline: none;
            box-shadow: 0 0 0 3px rgba(0,180,255,0.4);
        }

        .button-group{
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button{
            flex: 1;
            padding: 13px;

            border: none;
            border-radius: 10px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.25s;
        }

        button[type="submit"]{
            background: #0077b6;
            color: white;
        }

        button[type="submit"]:hover{
            background: #0096c7;
            transform: translateY(-2px);
        }

        .cancel-btn{
            background: #6c757d;
            color: white;
        }

        .cancel-btn:hover{
            background: #868e96;
            transform: translateY(-2px);
        }

        .error{
            margin-bottom: 25px;
            padding: 12px;

            border-radius: 10px;

            background: rgba(255,0,0,0.18);
            border: 1px solid rgba(255,0,0,0.35);

            text-align: center;
        }

        .port-label{
            position: absolute;
            bottom: 15px;
            right: 20px;

            font-size: 13px;
            opacity: 0.75;
        }

        a{
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="password-container">

        <h1>Modifica Password</h1>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/modifica_password">

            {% csrf_token %}

            <label for="password_vecchia">Password attuale</label>
            <input type="password" id="password_vecchia" name="password_vecchia" required>

            <label for="password_nuova">Nuova password</label>
            <input type="password" id="password_nuova" name="password_nuova" required>

            <label for="password_nuova_conferma">Conferma nuova password</label>
            <input type="password" id="password_nuova_conferma" name="password_nuova_conferma" required>

            <div class="button-group">

                <button type="submit">
                    Modifica Password
                </button>

                <a href="/login">
                    <button type="button" class="cancel-btn">
                        Annulla
                    </button>
                </a>

            </div>

        </form>

    </div>

    <div class="port-label">
        Porto di Amburgo
    </div>

</body>
</html>
