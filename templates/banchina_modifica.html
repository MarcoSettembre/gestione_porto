<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Banchina</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
                url('https://allcruisehotels.com/wp-content/uploads/2024/03/sydney-port-downtown.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .card{

            width:520px;

            padding:35px;

            background:rgba(255,255,255,0.10);

            border-radius:20px;

            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,0.18);

            box-shadow:0 8px 32px rgba(0,0,0,0.35);
        }

        h1{

            text-align:center;

            margin-bottom:25px;

            font-size:24px;

            line-height:1.4;
        }

        form{

            display:flex;
            flex-direction:column;
        }

        label{

            margin-bottom:8px;

            font-weight:bold;
        }

        input,
        select{

            margin-bottom:20px;

            padding:10px 12px;

            border:none;
            border-radius:10px;

            background:rgba(255,255,255,0.92);

            font-size:14px;
        }

        .button-group{

            display:flex;
            gap:10px;
        }

        button{

            padding:10px 14px;

            border:none;
            border-radius:10px;

            cursor:pointer;

            font-weight:bold;

            transition:0.2s;
        }

        .primary{

            background:#0077b6;
            color:white;
        }

        .primary:hover{

            background:#0096c7;

            transform:translateY(-2px);
        }

        .secondary{

            background:#023e8a;
            color:white;
        }

        .secondary:hover{

            background:#0353a4;

            transform:translateY(-2px);
        }

        .cancel{

            margin-top:18px;

            text-align:center;
        }

        .cancel button{

            background:rgba(255,255,255,0.15);

            color:white;
        }

        .cancel button:hover{

            background:rgba(255,255,255,0.25);

            transform:translateY(-2px);
        }

        .error{

            margin-top:20px;

            padding:12px;

            border-radius:10px;

            background:rgba(255,80,80,0.18);

            border:1px solid rgba(255,80,80,0.35);

            color:#ffd6d6;

            text-align:center;
        }

        .port-label{

            position:absolute;

            bottom:15px;
            right:20px;

            font-size:13px;

            opacity:0.75;

            color:white;

            background:rgba(0,0,0,0.3);

            padding:6px 10px;

            border-radius:8px;

            backdrop-filter:blur(6px);
        }

    </style>

</head>

<body>

<div class="card">

    <h1>
        Modifica Banchina numero {{banchina.numero}}
        <br>
        Settore {{banchina.settore}}
    </h1>

    <form method="POST"
          action="/banchina/modifica/{{banchina.numero}}/{{banchina.settore}}">

        {% csrf_token %}

        <label for="tipo">
            Tipo:
        </label>

        <select name="tipo"
                id="tipo"
                required>

            <option value="{{banchina.tipo}}">
                {{banchina.tipo}}
            </option>

            {% if banchina.tipo == "Crociera" %}

                <option value="Cargo">
                    Cargo
                </option>

            {% else %}

                <option value="Crociera">
                    Crociera
                </option>

            {% endif %}

        </select>

        <label for="lunghezza">
            Lunghezza:
        </label>

        <input type="number"
               step="any"
               name="lunghezza"
               id="lunghezza"
               value="{{banchina.lunghezza}}"
               required>

        <div class="button-group">

            <button type="submit" class="primary">
                Modifica
            </button>

            <button type="reset" class="secondary">
                Reset
            </button>

        </div>

    </form>

    <div class="cancel">

        <a href="/banchina">

            <button type="button">
                Annulla
            </button>

        </a>

    </div>

    {% if error %}

        <div class="error">
            Errore: {{ error }}
        </div>

    {% endif %}

</div>

<div class="port-label">
    Porto di Sydney
</div>

</body>
</html>
