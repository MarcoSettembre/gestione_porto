<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica Banchina</title>
</head>
<body>
    <h1>Modifica Banchina numero {{banchina.numero}} in settore {{banchina.settore}}</h1>
    <br><br>
    <form method="POST" action="/banchina/modifica/{{banchina.numero}}/{{banchina.settore}}">
        {% csrf_token %}
        <br><br>
        <label for="tipo">Tipo: </label>
        <select name="tipo" id="tipo" required>
            <option value="{{banchina.tipo}}">{{banchina.tipo}}</option>
            {% if banchina.tipo == "Crociera" %}
             <option value="Cargo">Cargo</option>
            {% else %}
             <option value="Crociera">Crociera</option>
            {% endif %}
        </select>
        <br><br>
        <label for="lunghezza">Lunghezza: </label>
        <input type="number" name="lunghezza" id="lunghezza" value="{{banchina.lunghezza}}" required>
        <br><br>
        <button type="submit">Modifica</button> <button type="reset">Reset</button>
    </form>
    <a href="/banchina"><button>Annulla</button></a>
    <br><br>
    {% if error %}
    Errore: {{ error }}
    {% endif %}
</body>
</html>
