<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiunta Merce</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;

            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
                url('https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Manila_South_Harbor_view_from_MH_sunset_%28Port_Area%2C_Manila%3B_07-20-2024%29.jpg/1280px-Manila_South_Harbor_view_from_MH_sunset_%28Port_Area%2C_Manila%3B_07-20-2024%29.jpg');

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            color:white;
        }

        .container{

            width:100%;
            max-width:650px;

            margin:auto;

            background:rgba(0,0,0,0.55);
            backdrop-filter:blur(10px);

            border:1px solid rgba(255,255,255,0.12);
            border-radius:18px;

            padding:35px;

            text-align:center;

            box-shadow:0 10px 25px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{

            width:80%;

            padding:10px;

            border-radius:8px;

            border:none;

            outline:none;
        }

        .actions{
            margin-top:25px;

            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        button{

            border:none;

            padding:10px 16px;

            border-radius:10px;

            cursor:pointer;

            font-weight:bold;

            transition:0.2s;
        }

        button[type="submit"]{
            background:#0077b6;
            color:white;
        }

        button[type="submit"]:hover{
            background:#0096c7;
        }

        button[type="reset"]{
            background:rgba(255,255,255,0.2);
            color:white;
        }

        button[type="reset"]:hover{
            background:rgba(255,255,255,0.3);
        }

        a button{
            background:#495057;
            color:white;
        }

        a button:hover{
            background:#6c757d;
        }

        .error{
            margin-top:15px;
            color:#ff6b6b;
            font-weight:bold;
        }

        .footer{
            width:100%;
            margin-top:auto;
            padding:20px 25px;
            text-align:right;
            font-size:13px;
            opacity:0.75;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Aggiunta merce nel container {{container_id}}</h1>

        {% if error %}
            <div class="error">
                Errore: {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="/cargo/merce/aggiungi/{{container_id}}">
            {% csrf_token %}

            <label for="sscc">SSCC</label>
            <input type="text" name="sscc" id="sscc" required>

            <label for="peso">Peso</label>
            <input type="number" step="any" min="0.0" name="peso" id="peso" required>

            <label for="paese">Paese</label>
            <input type="text" name="paese" id="paese" required>

            <label for="genere">Genere</label>
            <input type="text" name="genere" id="genere" required>

            <div class="actions">
                <button type="submit">Aggiungi</button>
                <button type="reset">Reset</button>
                <a href="/cargo/merce/{{container_id}}">
                    <button type="button">Annulla</button>
                </a>
            </div>

        </form>

    </div>

    <div class="footer">
        Porto di Manila
    </div>

</body>
</html>
